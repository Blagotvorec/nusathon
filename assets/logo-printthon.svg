<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" color="#0E0D0B" role="img" aria-label="Printthon">
  <!-- Layer upon layer, and the top one still going.

       Printing is the one operation in this family that is purely additive:
       nothing is cut, nothing is woven, a form simply accumulates. So the
       boards stack instead of crossing, each course shorter than the one it
       sits on, and the topmost stops halfway — the layer being laid right now.
       That unfinished course is the whole mark; finish it and this becomes a
       staircase, which is a shape and not a process.

       Родня Nusathon и Modulthon: та же доска в 22 единицы, тот же квадрат
       в 100, тот же зазор в 4. Переплести, повернуть, надстроить — три
       операции над одной и той же доской.

       Single colour, no gradients, no type: survives a 16px favicon. -->
  <g fill="currentColor">
    <rect x="0"  y="78" width="100" height="22"/>
    <rect x="8"  y="52" width="84"  height="22"/>
    <rect x="16" y="26" width="68"  height="22"/>
    <rect x="24" y="0"  width="30"  height="22"/>
  </g>
</svg>
